[BUILD]
build = normal

; Language codes available in the supplied Xbox assets: eng, fre, ger (text).
; Only list languages for which you have installed assets.
AllowedTextLanguages = eng,fre,ger
DefaultTextLanguage = eng
AllowedMovieLanguages = eng
DefaultMovieLanguage = eng
AllowedAudioLanguages = eng
DefaultAudioLanguage = eng

; 1 or true: PKGB manifests and loose resources only. assetsfb.zip is ignored.
; 0 or false: use the original packaged assets.
PreferFilesLoose = 1

; Unlock installed characters and costumes for mod testing (1/true or 0/false).
modderMode = 1

; Save local hardware, frame-time and transition reports for beta diagnosis.
performanceLogging = 1

; auto respects Windows/driver GPU preference. To override, use an adapter
; index from the session's renderer report (0, 1, ...).
graphicsAdapter = auto

; 4x HD texture pack (PNG). 1 or true: use replacements from HDTexturePack when
; that folder exists. 0 or false: original textures only. Relative folders are
; beside default.xbe.
HDTextures = 1
HDTexturePack = texturepack
